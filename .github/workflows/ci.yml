name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Download the pinned release asset directly. The setup action resolves releases
      # through the GitHub API, which can fail on hosted-runner rate limits.
      - name: Install Compact 0.31.1
        env:
          COMPACT_VERSION: 0.31.1
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/compact.zip \
            "https://github.com/midnightntwrk/compact/releases/download/compactc-v${COMPACT_VERSION}/compactc_v${COMPACT_VERSION}_x86_64-unknown-linux-musl.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q /tmp/compact.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/compactc"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'if [ "${1:-}" = "compile" ]; then shift; fi' \
            'exec "$HOME/.local/bin/compactc" "$@"' \
            > "$HOME/.local/bin/compact"
          chmod +x "$HOME/.local/bin/compact"
          "$HOME/.local/bin/compactc" --help > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run compile:contract
      - run: npm run typecheck
      - run: npm --workspace contract run build
      - run: npm run test
      - run: npm run build
