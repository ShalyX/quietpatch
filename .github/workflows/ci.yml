name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'

      - run: npm ci
      - run: npm run compile:contract
      - run: npm run typecheck
      - run: npm --workspace contract run build
      - run: npm run test
      - run: npm run build
